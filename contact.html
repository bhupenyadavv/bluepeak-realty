    <section class="banner"><h1>Contact Us</h1><p>Tell us what you are looking for</p></section>

      <div class="container">
        <form action="#" method="post">
          <div class="field"><label for="name">Full Name</label><input type="text" id="name" name="name" placeholder="Your name" required></div>
          <div class="field"><label for="email">Email</label><input type="email" id="email" name="email" placeholder="you@example.com" required></div>
          <div class="field"><label for="message">Message</label><textarea id="message" name="message" placeholder="I want to buy a giant shoe..." required></textarea></div>

        </form>
      </div>
    </section>
